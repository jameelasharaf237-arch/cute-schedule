<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Cute Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4a3550;--soft:#9b8aa3;--pink:#ff8fb8;--pinkd:#e85c94;--line:#f3dcea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#ffeaf4,#f3f0ff 55%,#eaf7ff);min-height:100vh;padding-bottom:96px}
main{max-width:480px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{margin:6px 0 2px;font-size:24px}h3{margin:18px 0 8px;font-size:18px}
.sub{color:var(--soft);font-size:14px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px #e8b8d033}
.hi{font-weight:800;font-size:18px}
.bar{width:150px;height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb8cf,#c9a8ff);border-radius:9px}
.stars{font-weight:800;font-size:20px;background:#fff6d6;padding:6px 14px;border-radius:16px}
.hero{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.mascot{width:130px;flex-shrink:0;cursor:pointer}
.bubble{flex:1;background:#fff;border-radius:20px;padding:12px 14px;font-weight:600;position:relative;box-shadow:0 4px 14px #e8b8d033}
.bubble:after{content:'';position:absolute;left:-10px;top:40%;border:10px solid transparent;border-right-color:#fff;border-left:0}
.card{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 6px 18px #e8b8d033;margin-bottom:10px;border-left:8px solid var(--c,#ffb8cf)}
.next{background:linear-gradient(135deg,#fff,var(--c));border-left:none}
.tag{display:inline-block;background:var(--d);color:#fff;padding:2px 12px;border-radius:12px;font-size:13px;font-weight:600}
.cname{font-size:24px;font-weight:800;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px}
.cd{font-size:20px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:12px;font:inherit;font-weight:800;font-size:16px;background:var(--pinkd);color:#fff;margin-top:8px;cursor:pointer;box-shadow:0 4px 0 #c2457a}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,nav button:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--pinkd);box-shadow:0 4px 0 #f3c7da;border:2px solid #f9d3e3}
.done{background:#e6fbef;color:#2f8a57;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px}
.item{display:flex;align-items:center;gap:10px}
.item .mini{width:52px;flex-shrink:0}
.item .t{flex:1}.item b{font-size:17px}.item small{display:block;color:var(--soft)}
.past{opacity:.5}
.live{background:#ffe3ee}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{border:0;font:inherit;font-weight:600;padding:6px 14px;border-radius:14px;background:#fff;color:var(--ink);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pinkd);color:#fff}
.chip.today:not(.on){outline:2px dashed var(--pink)}
.empty{text-align:center;padding:20px}.empty .mascot{margin:0 auto}
.map{position:relative;width:100%;aspect-ratio:360/440;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px #9ccf9a44}
.map svg{width:100%;height:100%;display:block}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--soft)}
.inp{width:100%;font:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:7px 10px;background:#fffafd;min-width:0}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 10px #e8b8d022}
.drow small{color:var(--soft)}
.x{border:0;background:#ffe3ee;color:var(--pinkd);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0}
.imsg{font-weight:600;font-size:14px;margin-top:8px;min-height:4px}
.spin{display:inline-block;animation:bob 1s infinite}
.duo{display:flex;flex-shrink:0;align-items:flex-end}
.duo .mascot{width:92px}.duo .mascot+.mascot{width:80px;margin-left:-14px}
.avstage{position:relative;background:linear-gradient(180deg,#fff,#ffeaf3);border-radius:26px;padding:12px 0 8px;margin-bottom:10px;box-shadow:0 6px 18px #e8b8d033;text-align:center}
.avbig{width:170px;margin:0 auto;cursor:pointer}
.avname{font-weight:800;font-size:20px}
.stars.sm{position:absolute;top:10px;right:10px;font-size:15px;padding:4px 10px}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:6px}
.avopt{position:relative;border:2px solid var(--line);background:#fff;border-radius:16px;padding:4px 2px 6px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.avopt.on{border-color:var(--pinkd);background:#fff0f6}
.avopt small{display:block;font-size:11px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avopt.lock .avmini{opacity:.35;filter:grayscale(.6)}
.avopt i{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-style:normal;font-weight:800;font-size:11px;background:#fff;border-radius:10px;padding:1px 6px;white-space:nowrap;box-shadow:0 2px 6px #0002}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:6px 2px 10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--pinkd)}
nav button{padding:4px 6px}
.mbtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px;box-shadow:0 4px 14px #e8b8d066;cursor:pointer;z-index:11}
.mbtn.off{opacity:.7}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:0;font:inherit;font-weight:800;padding:8px;border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pinkd);color:#fff}
.mapwrap{overflow:auto;border-radius:22px;background:#fff;box-shadow:0 6px 18px #e8b8d033;max-width:100%;max-height:72vh;-webkit-overflow-scrolling:touch}
.mapin{position:relative;max-width:none}
.mapin img{display:block;width:100%;height:auto;max-width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;width:28px;height:28px;z-index:2}
.pin:before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--pinkd);border:3px solid #fff;box-shadow:0 2px 6px #0004}
.pin:after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--pinkd);animation:ping 1.6s infinite}
.pin.nextp:before{background:#ffb800}.pin.nextp:after{border-color:#ffb800}
.pin span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;font-size:11px;line-height:1.5;padding:0 7px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 6px #0002}
.pin.sel span{background:var(--pinkd);color:#fff}
.zoom{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0;font-weight:800}
.zoom button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--pinkd);font:inherit;font-size:22px;font-weight:800;box-shadow:0 3px 0 #f3c7da;cursor:pointer}
.walker{z-index:3}
@keyframes ping{from{transform:scale(.7);opacity:1}to{transform:scale(1.9);opacity:0}}
.walker{position:absolute;width:50px;transform:translate(-50%,-85%);pointer-events:none}
.walking svg{animation:waddle .25s infinite alternate}
.bld{cursor:pointer}
.qbox{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 18px #e8b8d033;text-align:center}
.qbox .mascot{margin:0 auto;width:110px}
.q{font-size:19px;font-weight:800;margin:8px 0 12px}
.opt{display:block;width:100%;font:inherit;font-size:17px;font-weight:600;border:2px solid var(--line);background:#fffafd;color:var(--ink);border-radius:16px;padding:10px;margin:7px 0;cursor:pointer}
.opt.right{background:#c9f5da;border-color:#5cbf8c}
.opt.wrong{background:#ffd3d8;border-color:#e86a7a}
.score{display:flex;justify-content:space-around;margin-bottom:10px;font-weight:800}
.score span{background:#fff;padding:6px 12px;border-radius:14px}
.fb{font-size:20px;font-weight:800;min-height:30px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:linear-gradient(180deg,var(--c),#fff 70%);border-radius:22px;padding:12px;text-align:center;box-shadow:0 6px 18px #e8b8d033}
.fcard .fch{width:90px;margin:0 auto;cursor:pointer}
.fcard b{display:block;font-size:19px}.fcard small{display:block;color:var(--soft);font-size:12px}
.fcard input{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin:6px 0;text-align:center;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 20px #e8b8d044;border-radius:24px 24px 0 0;z-index:10}
nav button{border:0;background:none;font:inherit;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 8px;border-radius:14px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{color:var(--pinkd);background:#ffeaf3;font-weight:800}
.bob{animation:bob 2.4s ease-in-out infinite}
.jump{animation:jump .5s}
.shake{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes jump{30%{transform:translateY(-22px) scale(1.05,.95)}60%{transform:translateY(0) scale(.95,1.05)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg) translateY(-3px)}}
.cf{position:fixed;top:-12px;width:9px;height:13px;border-radius:3px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:16px;font-weight:800;z-index:100;animation:jump .5s}
.note{font-size:12px;color:var(--soft);text-align:center;margin-top:10px}
</style>
</head>
<body>
<main id="main"></main>
<button id="mbtn" class="mbtn" onclick="toggleMusic()" aria-label="Turn music off">🎵</button>
<nav>
 <button data-t="home" class="on" onclick="go('home')"><span>🏠</span>Home</button>
 <button data-t="week" onclick="go('week')"><span>📅</span>Week</button>
 <button data-t="map" onclick="go('map')"><span>🗺️</span>Map</button>
 <button data-t="quiz" onclick="go('quiz')"><span>🎮</span>Game</button>
 <button data-t="friends" onclick="go('friends')"><span>💖</span>Buddies</button>
 <button data-t="me" onclick="go('me')"><span>👗</span>Me</button>
</nav>
<script>
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const BASE=[
 {char:'Hana',color:'#ffc4d8',dark:'#e07aa0',st:'hana',outfit:'#ffffff',shoe:'#5b3a45',hair:'#ffd0de',hairD:'#e89ab4',iris:'#3a2630',lines:['The lab is waiting for us! 🧪','Got your safety goggles on? 🥽','The next experiment will work 💗']},
 {char:'Riku',color:'#ffe0b3',dark:'#e8a55a',st:'riku',outfit:'#b8c6ea',shoe:'#5b3a45',hair:'#9aa6d4',hairD:'#6f7bb0',iris:'#3a2630',lines:['Safety first! ⛑️','Let\'s build our future 🏗️','Don\'t forget to eat something 🍙']},
 {char:'Yuki',color:'#ddd0ff',dark:'#9b7fe0',st:'yuki',outfit:'#bfead6',shoe:'#5b3a45',hair:'#ddd0ff',hairD:'#ad97e6',iris:'#3a2630',lines:['Let\'s review together 📖','Little by little, you\'ll get it all ✨','I\'m so proud of you 🥹']},
 {char:'Sora',color:'#c4dfff',dark:'#6aa3e8',st:'sora',outfit:'#b3d4f5',shoe:'#5b3a45',hair:'#ffd2ad',hairD:'#e8a271',iris:'#3a2630',lines:['Fully charged today? ⚡','Headphones on, focus mode 🎧','Hurry, let\'s catch the class! 🏃']}
];
const XNAMES=['Mei','Kai','Nana','Ren','Aoi','Taro','Hina','Sumi'];
const XHAIR=[['#c8ecd2','#86c79b'],['#ffe7a3','#e0b85a'],['#cfe6ff','#8db6e6'],['#f6d1ff','#c78fe0']];
const SAMPLE=[
 {code:'CH 5101',crn:'',d:0,s:'09:00',e:'10:50',bld:'19',cam:'A',room:'Bldg 19 · 19.101'},
 {code:'MA 5202',crn:'',d:0,s:'13:00',e:'14:50',bld:'10',cam:'A',room:'Bldg 10 · 10.05'},
 {code:'CH 5303',crn:'',d:1,s:'10:00',e:'11:50',bld:'25',cam:'B',room:'Bldg 25 · 25.110'},
 {code:'EN 5404',crn:'',d:2,s:'09:00',e:'10:50',bld:'20',cam:'B',room:'Bldg 20 · 20.105'},
 {code:'CH 5101',crn:'',d:3,s:'11:00',e:'12:50',bld:'19',cam:'A',room:'Bldg 19 · 19.101'},
 {code:'MA 5202',crn:'',d:4,s:'09:00',e:'10:50',bld:'10',cam:'A',room:'Bldg 10 · 10.05'}
];
let SCHED=[],S=[],COURSES={};
const ckeyOf=code=>code.replace(/\s+/g,'').toUpperCase();
function build(){
 COURSES={};const codes=[...new Set(SCHED.map(x=>ckeyOf(x.code)))];
 codes.forEach((key,i)=>{const b=BASE[i%4],v=Math.floor(i/4),first=SCHED.find(x=>ckeyOf(x.code)===key);
  const k={...b,code:first.code,crn:first.crn||''};
  if(v){k.char=XNAMES[(i-4)%XNAMES.length];const h=XHAIR[(i-4)%XHAIR.length];k.hair=h[0];k.hairD=h[1]}
  COURSES[key]=k});
 S=SCHED.map(x=>({d:+x.d,s:x.s,e:x.e,c:ckeyOf(x.code),room:x.room||('Bldg '+x.bld),b:String(x.bld).toUpperCase()+x.cam}));
}
// building positions on the official maps, in % of the image
const PA={'11':[283,84],'36':[215,96],'31':[318,102],'20':[365,100],'35':[153,138],'32':[232,136],'8':[352,133],'5':[410,118],'24':[468,152],'33':[182,171],'12':[277,175],'34':[145,195],'9':[388,186],'10':[412,176],'26':[334,207],'28':[213,213],'7':[342,224],'30':[160,227],'18':[478,233],'29':[182,244],'19':[400,258],'13':[523,268],'27':[230,265],'27A':[255,290],'26A':[346,278],'14':[486,322],'16':[345,378],'15':[423,394],'6':[169,537],'6A':[170,520]};
const PB={'7A':[105,43],'9A':[156,40],'9':[196,38],'7':[98,65],'7B':[150,73],'11C':[237,52],'11D':[248,48],'11E':[280,48],'11F':[328,48],'15':[376,80],'12C':[66,91],'12B':[66,106],'12':[66,124],'12A':[66,145],'8':[138,97],'23':[195,99],'11B':[242,84],'11A':[242,98],'14B':[275,87],'14C':[300,89],'14A':[275,99],'14D':[301,99],'11G':[341,87],'5A':[109,138],'5E':[135,129],'5D':[163,129],'5B':[135,147],'5C':[163,147],'22':[205,139],'6F':[252,130],'6E':[291,130],'6D':[326,130],'6A':[253,147],'6B':[289,147],'6C':[326,147],'25':[413,135],'4':[97,191],'3':[157,191],'10':[263,225],'2':[296,280],'1':[384,270],'17':[437,245],'20':[569,277]};
function bld(id){const cam=id.slice(-1),num=id.slice(0,-1),t=cam==='B'?PB:PA,p=t[num]||t[num.replace(/[A-Z]$/,'')];
 return {c:cam,name:'Bldg '+num,x:p?p[0]/724*100:null,y:p?p[1]/(cam==='B'?513:646)*100:null}}
const GATES={A:{x:17.5,y:82.5},B:{x:33.1,y:81.3}};
const LINES=['Let\'s go to class together! 💪','Don\'t forget your water 💧','You\'re doing great 🌸','Focus a bit, then a break ☕','Future chemical engineer 🧪','Tap me again 😆','Japan is getting closer! 🇯🇵✨','Sleep well tonight 🌙'];

const AV_F={hair:'buns',hc:'#3b2b2e',skin:'#ffe2cc',outfit:'coat',oc:'#ffc2d6',acc:'bow'};
const AV_M={hair:'short',hc:'#3b2b2e',skin:'#ffe2cc',outfit:'hoodie',oc:'#b3d4f5',acc:'none'};
function loadAv(){let v;try{v=JSON.parse(localStorage.getItem('cs_av'))}catch(e){}
 if(!v||typeof v!=='object')return{g:'f',f:{...AV_F},m:{...AV_M}};
 if(!v.g)return{g:'f',f:{...AV_F,...v},m:{...AV_M}};
 return{g:v.g==='m'?'m':'f',f:{...AV_F,...(v.f||{})},m:{...AV_M,...(v.m||{})}}}
const myAv=()=>({...state.av[state.av.g],g:state.av.g});
const store={get(k,d){try{const v=localStorage.getItem('cs_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cs_'+k,JSON.stringify(v))}catch(e){}}};
const state={music:store.get('music',true),av:loadAv(),me:store.get('me',''),stars:store.get('stars',0),names:store.get('names',{}),checks:store.get('checks',{}),best:store.get('best',0)};
function save(){for(const k of ['music','av','me','stars','names','checks','best'])store.set(k,state[k])}
function saveSched(){store.set('sched',SCHED);build();Q=null;walker.campus=null;walker.pos='gate'}
SCHED=store.get('sched',[]);if(!Array.isArray(SCHED))SCHED=[];build();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const courseName=c=>esc(state.names[c]||COURSES[c].code);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function fmt(t){let[h,m]=t.split(':').map(Number);const suf=h<12?'AM':'PM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${suf}`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function mix(h,t){const n=parseInt(h.slice(1),16),f=v=>Math.round(v+(255-v)*t);return '#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}
function chibiFace(c,mood){
 const L='#3a2630',OL='#5b3a45';
 let eyes=[38,62].map(x=>`<ellipse cx="${x}" cy="54" rx="3.3" ry="4.5" fill="${L}"/><circle cx="${x+.9}" cy="52.4" r="1.1" fill="#fff"/>`).join(''),

function findNext(now=new Date()){
 for(let off=0;off<8;off++){
  const d=new Date(now);d.setDate(now.getDate()+off);d.setHours(0,0,0,0);
  const list=S.filter(x=>x.d===d.getDay()).sort((a,b)=>toMin(a.s)-toMin(b.s));
  for(const x of list){
   const st=new Date(d);st.setMinutes(toMin(x.s));
   const en=new Date(d);en.setMinutes(toMin(x.e));
   if(en>now)return{x,st,en,now:st<=now};
  }
 }
}

 const d=typeof c.day==='number'?c.day:DAYS.findIndex(n=>n.toLowerCase().startsWith(String(c.day||'').toLowerCase().slice(0,3)));

 <button class="btn ghost" onclick="SCHED=SAMPLE.map(x=>({...x}));saveSched();go('home')">⭐ Try a sample schedule</button></div>
 ${draft?draftHTML():''}`;
}
function draftHTML(){return `<div class="card"><h3 style="margin-top:0">Found ${draft.length} classes 🎉</h3><p class="sub">Check them against your timetable, then save. You can fix or delete any class after.</p>
 ${draft.map(x=>`<div class="drow"><b>${esc(x.code)}</b> · ${DAYS[x.d].slice(0,3)} ${fmt(x.s)}–${fmt(x.e)}<br><small>${esc(x.room)} · Campus ${x.cam}</small></div>`).join('')}
 <button class="btn" onclick="SCHED=draft;draft=null;importMsg='';saveSched();toast('Schedule saved 🎉');go('home')">Save schedule</button><button class="btn ghost" onclick="draft=null;render()">Cancel</button></div>`}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.88)};img.onerror=()=>rej();img.src=u})}
function setMsg(t){importMsg=t;const el=$('#imsg');if(el)el.innerHTML=t}
// Reads class blocks out of OCR words from a Banner "Week at a Glance" screenshot
function parseWeekWords(words){
 const DAYN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
 const W=words.filter(w=>w.text&&w.text.trim()).map(w=>({t:w.text.trim(),x0:w.x0,y0:w.y0,x1:w.x1,y1:w.y1}));
 const heads=[];for(const w of W){const t=w.t.toLowerCase().replace(/[^a-z]/g,'');const i=DAYN.indexOf(t);if(i>=0)heads.push({d:i,cx:(w.x0+w.x1)/2,y:w.y1,h:w.y1-w.y0})}
 if(heads.length<3)return {error:'nodays',classes:[]};
 let best=[];for(const h of heads){const row=heads.filter(o=>Math.abs(o.y-h.y)<h.h);const uniq=[...new Map(row.map(o=>[o.d,o])).values()];if(uniq.length>best.length)best=uniq}
 if(best.length<3)return {error:'nodays',classes:[]};
 best.sort((a,b)=>a.cx-b.cx);const hy=Math.max(...best.map(b=>b.y));
 const gap=(best[best.length-1].cx-best[0].cx)/(best.length-1);
 const bounds=best.map((b,i)=>[i?(best[i-1].cx+b.cx)/2:b.cx-gap/2,i<best.length-1?(b.cx+best[i+1].cx)/2:b.cx+gap/2]);
 const cols=best.map(()=>[]);
 for(const w of W){if(w.y0<hy+2)continue;const x=w.x0+Math.min((w.x1-w.x0)/2,12);const ci=bounds.findIndex(([a,b])=>x>=a&&x<b);if(ci>=0)cols[ci].push(w)}
 const fixNum=s=>s.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5');
 const out=[];
 cols.forEach((ws,ci)=>{
  ws.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);const lines=[];
  for(const w of ws){const l=lines.find(l=>Math.abs(l.y-w.y0)<(w.y1-w.y0)*.6);if(l)l.ws.push(w);else lines.push({y:w.y0,ws:[w]})}
  const text=lines.sort((a,b)=>a.y-b.y).map(l=>l.ws.sort((a,b)=>a.x0-b.x0).map(w=>w.t).join(' ')).join(' ');
  const re=/\b([A-Z]{2,4})\s*([0-9OIlS]{4})\s*[-–—]\s*[0-9OIlS]{3}/g;const hits=[];let m;
  while((m=re.exec(text)))hits.push({i:m.index,end:re.lastIndex,code:m[1]+' '+fixNum(m[2])});
  hits.forEach((h,k)=>{const seg=text.slice(h.end,k+1<hits.length?hits[k+1].i:text.length);
   const crn=(seg.match(/\b([0-9OIl]{5})\b/)||[])[1];
   const tm=seg.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?\s*[-–—~]\s*(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?/i);
   const rm=seg.match(/\b(BLDG?\s*[0-9OIl]{1,2}[A-Z]?)\s+([0-9OIl]{1,2}\s*[.,]\s*[0-9A-Z]{1,4})/i);
   if(!tm)return;
   let a1=(tm[3]||tm[6]||'').toLowerCase(),a2=(tm[6]||tm[3]||'').toLowerCase();
   const to24=(h,mm,ap)=>{h=+h;if(!ap)ap=h>=7&&h<12?'am':'pm';if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return String(h).padStart(2,'0')+':'+mm};
   let s=to24(tm[1],tm[2],a1),e=to24(tm[4],tm[5],a2);
   if(e<=s&&!tm[6])e=to24(tm[4],tm[5],'pm');
   const room=rm?(rm[1].toUpperCase().replace(/\s+/g,'').replace(/^(BLDG?)(.*)$/,(x,p,r)=>p+fixNum(r))+' '+fixNum(rm[2].replace(/\s+/g,'').replace(',','.'))):'';
   out.push({code:h.code,crn:crn?fixNum(crn):'',day:DAYN[best[ci].d][0].toUpperCase()+DAYN[best[ci].d].slice(1),start:s,end:e,room});
  });
 });
 return {classes:out};
}


let tessP=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(tessP)return tessP;
 tessP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>{tessP=null;rej(new Error('load'))};document.head.appendChild(sc)});return tessP}
function prepCanvas(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{
 const sc=Math.min(2,2600/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
 const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,0,0,c.width,c.height);
 const d=g.getImageData(0,0,c.width,c.height),px=d.data;let lo=255,hi=0;
 for(let i=0;i<px.length;i+=4){const v=px[i]*.3+px[i+1]*.59+px[i+2]*.11;px[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
 const k=255/Math.max(1,hi-lo);for(let i=0;i<px.length;i+=4){const v=(px[i]-lo)*k;px[i]=px[i+1]=px[i+2]=v}
 g.putImageData(d,0,0);URL.revokeObjectURL(u);res(c)};img.onerror=()=>rej(new Error('img'));img.src=u})}
async function ocrRead(file){
 setMsg('<span class="spin">🔍</span> Getting the reader ready…');
 await loadTess();
 const canvas=await prepCanvas(file);
 const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')setMsg(`<span class="spin">🔍</span> Reading your schedule… ${Math.round(m.progress*100)}%`);else if(/load|init/.test(m.status))setMsg('<span class="spin">🔍</span> Getting the reader ready… (first time takes a bit)')}});
 try{const {data}=await worker.recognize(canvas,{},{blocks:true});
  let words=data.words;
  if(!words||!words.length){words=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(w=>words.push(w)))))}
  return parseWeekWords(words.map(w=>({text:w.text,x0:w.bbox.x0,y0:w.bbox.y0,x1:w.bbox.x1,y1:w.bbox.y1})));
 }finally{worker.terminate()}
}
async function importShot(file){
 if(!file||importBusy)return;importBusy=true;
 try{
  const sample=window.claude?.use?await claude.use('sample'):null;
  let list;
  if(sample){
   setMsg('<span class="spin">🔍</span> Reading your schedule… this can take up to a minute');
   const img=await shrink(file);
   const data=await sample.json(`This image is a screenshot of a university weekly timetable (for example the Ellucian Banner "Week at a Glance" page at Bahrain Polytechnic). Extract every class meeting shown in the grid. A course that meets on three days is three entries. Ignore notices, banners and anything that is not a class block.
Return only JSON in exactly this shape:
{"classes":[{"code":"EN 7917","crn":"10361","day":"Sunday","start":"08:00","end":"09:50","room":"BLDG19 19.325"}]}
code = course code as printed (letters, space, number, no section suffix). crn = the 5-digit number shown on the block, or "". day = English weekday name of the column. start/end = 24-hour HH:MM. room = the building and room text exactly as printed. If there are no classes, return {"classes":[]}.`,{images:[img],modelTier:'default'});
   list=normalize(data&&data.classes);
  }else{
   const r=await ocrRead(file);
   if(r.error==='nodays'){setMsg('I couldn’t find the Sunday–Saturday header. Use a screenshot of the full <b>Week at a Glance</b> grid 📸');return}
   list=normalize(r.classes);
  }
  if(!list.length){setMsg('I couldn’t find any classes in that picture. Try a clearer screenshot of the whole week 📸')}
  else{draft=list;setMsg('');render()}
 }catch(e){const m={not_granted:'You didn’t allow reading the picture, so nothing was sent. Add classes by hand instead ✏️',rate_limited:'Too many tries right now. Wait a minute and try again.',image_rejected:'That picture couldn’t be read. Try a PNG or JPG screenshot.',images_unavailable:'Reading pictures isn’t available here. Add classes by hand instead ✏️',invalid_json:'I got confused reading that one. Try again with a clearer screenshot.'};
  setMsg(m[e&&e.code]||(e&&e.message==='load'?'The reader needs internet the first time. Connect and try again 📶':'Something went wrong reading the picture. Try again, or add classes by hand.'))}
 finally{importBusy=false}
}
function renderEdit(){
 const opt=(n,v)=>`<option value="${v}">${n}</option>`;
 const rows=SCHED.map((x,i)=>({...x,i})).sort((a,b)=>a.d-b.d||toMin(a.s)-toMin(b.s)).map(x=>`<div class="drow"><div><b>${esc(x.code)}</b> · ${DAYS[x.d].slice(0,3)} ${fmt(x.s)}–${fmt(x.e)}<br><small>${esc(x.room)} · Bldg ${esc(x.bld)} · Campus ${x.cam}</small></div><button class="x" onclick="SCHED.splice(${x.i},1);saveSched();Q=null;render()" aria-label="Delete">✕</button></div>`).join('');
 return `<h2>Edit Schedule ✏️</h2><p class="sub">${SCHED.length} classes saved on this device</p>
 ${draft?draftHTML():''}
 <div class="card">${shotButton()}<div class="imsg" id="imsg">${importMsg}</div></div>
 <div class="card"><h3 style="margin-top:0">Add a class</h3>
 <div class="frm">
  <label class="lbl" for="f-code">Course code<input id="f-code" class="inp" placeholder="EN 7917"></label>
  <label class="lbl" for="f-crn">CRN (optional)<input id="f-crn" class="inp" inputmode="numeric" placeholder="10361"></label>
  <label class="lbl" for="f-day">Day<select id="f-day" class="inp">${DAYS.map((d,i)=>opt(d,i)).join('')}</select></label>
  <label class="lbl" for="f-cam">Campus<select id="f-cam" class="inp">${opt('Campus A','A')}${opt('Campus B','B')}</select></label>
  <label class="lbl" for="f-s">Starts<input id="f-s" class="inp" type="time" value="08:00"></label>
  <label class="lbl" for="f-e">Ends<input id="f-e" class="inp" type="time" value="09:50"></label>
  <label class="lbl" for="f-b">Building<input id="f-b" class="inp" placeholder="19"></label>
  <label class="lbl" for="f-r">Room<input id="f-r" class="inp" placeholder="19.325"></label>
 </div><div class="imsg" id="fmsg"></div>
 <button class="btn" onclick="addClass()">➕ Add class</button></div>
 ${SCHED.length?`<h3>My classes</h3>${rows}<button class="btn ghost" onclick="clearTap(this)">🗑 Clear all classes</button>`:''}
 ${S.length?`<button class="btn ghost" onclick="go('home')">Done</button>`:''}`;
}
function addClass(){const v=id=>$('#'+id).value.trim(),code=v('f-code').toUpperCase(),b=v('f-b').toUpperCase(),s=v('f-s'),e=v('f-e');
 if(!code||!b||!s||!e){$('#fmsg').textContent='Fill in the course code, building and times.';return}
 if(toMin(e)<=toMin(s)){$('#fmsg').textContent='The end time needs to be after the start time.';return}
 SCHED.push({code,crn:v('f-crn'),d:+v('f-day'),s,e,bld:b,cam:v('f-cam'),room:v('f-r')?`Bldg ${b} · ${v('f-r')}`:`Bldg ${b}`});
 saveSched();Q=null;toast('Class added ✨');render()}
let ct=0;function clearTap(b){if(Date.now()-ct<3000){SCHED=[];saveSched();Q=null;walker.campus=null;toast('Cleared');render()}else{ct=Date.now();b.textContent='Tap again to clear everything ⚠️'}}

let rt=0;function resetTap(b){if(Date.now()-rt<3000){state.stars=0;state.checks={};state.best=0;save();toast('Reset done 🔄');render()}else{rt=Date.now();b.textContent='Tap again to confirm ⚠️'}}
function poke(el,c){el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');const b=$('#bub');if(b)b.textContent=`I'm ${COURSES[c].char}! ${line(c)}`;ding()}
function confetti(){const cols=['#ff8fb8','#c9a8ff','#8fd3ff','#ffe14d','#8fd694'];for(let i=0;i<34;i++){const s=document.createElement('span');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=cols[i%5];s.style.animationDuration=(1.2+Math.random()*1.2)+'s';s.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

// ---------- calm background music (generated live, no files) ----------
const Music={ctx:null,master:null,timer:null,next:0,step:0,playing:false};
const CHORDS=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const MEL=[[72,76,79,81],[71,74,76,79],[72,74,77,81],[71,72,76,79]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mInit(){const c=new(window.AudioContext||window.webkitAudioContext)();
 const master=c.createGain();master.gain.value=0;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
 const len=c.sampleRate*2.8|0,ir=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
 const rev=c.createConvolver();rev.buffer=ir;const wet=c.createGain();wet.gain.value=.45;
 lp.connect(master);lp.connect(rev);rev.connect(wet);wet.connect(master);master.connect(c.destination);
 Music.ctx=c;Music.master=master;Music.bus=lp}
function mNote(t,m,dur,type,vol,atk){const c=Music.ctx,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);
 g.gain.setTargetAtTime(0,t+Math.max(atk,dur-.6),.45);o.connect(g);g.connect(Music.bus);o.start(t);o.stop(t+dur+2.5)}
function mBell(t,m,vol){const c=Music.ctx;[[1,1],[2,.25],[3,.06]].forEach(([h,v])=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=mtof(m)*h;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*v,t+.008);
 g.gain.exponentialRampToValueAtTime(.0001,t+1.8/h);o.connect(g);g.connect(Music.bus);o.start(t);o.stop(t+2)})}
function mTick(){const c=Music.ctx,e=60/66/2;
 while(Music.next<c.currentTime+.5){const t=Music.next,k=Music.step,ci=Math.floor(k/8)%4,ch=CHORDS[ci];
  if(k%8===0){ch.forEach(m=>mNote(t,m,e*8+.4,'triangle',.032,1.4));mNote(t,ch[0]-12,e*8,'sine',.06,.6)}
  const p=k%8===0?.9:k%2===0?.45:.2;
  if(Math.random()<p){const pool=MEL[ci];mBell(t+(Math.random()*.02),pool[Math.random()*pool.length|0],.07)}
  Music.next+=e;Music.step++}}
function musicPlay(){try{if(!Music.ctx)mInit();const c=Music.ctx;c.resume();
 if(!Music.playing){Music.playing=true;Music.next=c.currentTime+.1;Music.timer=setInterval(mTick,120);mTick()}
 Music.master.gain.cancelScheduledValues(c.currentTime);Music.master.gain.setTargetAtTime(.55,c.currentTime,.8)}catch(e){}}
function musicStop(){if(!Music.ctx||!Music.playing)return;const c=Music.ctx;
 Music.master.gain.cancelScheduledValues(c.currentTime);Music.master.gain.setTargetAtTime(0,c.currentTime,.25);
 clearInterval(Music.timer);Music.playing=false;setTimeout(()=>{if(!Music.playing)c.suspend()},1200)}
function musicBtn(){const b=$('#mbtn');if(b){b.textContent=state.music?'🎵':'🔇';b.setAttribute('aria-label',state.music?'Turn music off':'Turn music on');b.classList.toggle('off',!state.music)}}
function toggleMusic(){state.music=!state.music;save();state.music?musicPlay():musicStop();musicBtn();toast(state.music?'Music on 🎵':'Music off')}
document.addEventListener('pointerdown',function first(ev){document.removeEventListener('pointerdown',first,true);if(state.music&&!(ev.target.closest&&ev.target.closest('#mbtn')))musicPlay()},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(state.music&&Music.ctx)musicPlay()});

let ac;function ding(ok=true){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(ok?660:240,t);o.frequency.exponentialRampToValueAtTime(ok?1320:160,t+.15);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3)}catch(e){}}
render();musicBtn();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
